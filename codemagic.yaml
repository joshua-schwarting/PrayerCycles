workflows:
  android-release:
    name: Android Release
    max_build_duration: 30
    # Android needs no macOS, but the free plan's 500 included minutes are
    # macOS M2 minutes — Linux is billed separately, so build here to stay free.
    instance_type: mac_mini_m2
    environment:
      groups:
        # Codemagic UI group holding the upload keystore, all secure:
        # ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
        # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
        - codesigning-android
      vars:
        MARKETING_VERSION: "1.2"
      node: 22
    # Triggered by hand for now. Add the push trigger once the Play listing is
    # live, so an iOS push doesn't also burn minutes on an Android build.
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Set up the upload keystore
        script: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_B64 is empty — check the codesigning-android group."
            exit 1
          fi
          # Decoded to a path outside the repo so it can never be committed, and
          # handed to Gradle through CM_KEYSTORE_PATH (see android/app/build.gradle).
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$HOME/upload-keystore.jks"
          echo "CM_KEYSTORE_PATH=$HOME/upload-keystore.jks" >> "$CM_ENV"
          echo "CM_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$CM_ENV"
          echo "CM_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$CM_ENV"
          echo "CM_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$CM_ENV"
      - name: Build Android app bundle
        script: |
          set -e
          # Capacitor 8 compiles against Java 21; the machine's default JDK is
          # older, which fails as "invalid source release: 21".
          echo "JDKs on this machine:"
          /usr/libexec/java_home -V 2>&1 || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          java -version
          cd android
          # The machine's own ~/.gradle/gradle.properties pins an older
          # org.gradle.java.home, which beats JAVA_HOME — so the daemon compiled
          # with JDK 17 even with 21 on PATH. A command-line -D wins over both.
          ./gradlew bundleRelease -Dorg.gradle.java.home="$JAVA_HOME"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    # Publishing to Play needs a service-account JSON linked in Play Console.
    # Until that exists, download the .aab from this build and upload it by hand.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal

  ios-release:
    name: iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    # MUST exactly match the App Store Connect integration name in Codemagic
    # (Team settings -> Integrations -> App Store Connect). It is named for the
    # account rather than this app because the key authenticates the ACCOUNT
    # and is shared with the other apps here, so renaming it means renaming
    # the integration and every repo that references it, together.
    integrations:
      app_store_connect: "Joshua Schwarting ASC"
    environment:
      groups:
        # Codemagic UI group that holds CERTIFICATE_PRIVATE_KEY (secure).
        - codesigning
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.prayercycles.app"
        TEAM_ID: "AY34BV93Z7"
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          # CERTIFICATE_PRIVATE_KEY is the base64 of a traditional (PKCS#1) RSA
          # private key, stored single-line so newlines can't be mangled in the
          # Codemagic UI. Decode it to a file and pass it so fetch-signing-files
          # --create can create the distribution cert once and reuse it after.
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS app
        script: |
          # Resolve the profile fetch-signing-files downloaded. Xcode 16+/26 moved
          # provisioning profiles to the Xcode UserData dir, so search both the old
          # (MobileDevice) and new (Xcode UserData) locations. Pass the profile UUID
          # to the archive explicitly since use-profiles isn't writing it into the
          # App target on this SPM project. UUID avoids the space-in-name xcargs issue.
          PROFILE_PATH=$(ls -t \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision \
            2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: no provisioning profile found. Listing both locations:"
            echo "--- MobileDevice ---"
            ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "  (missing)"
            echo "--- Xcode UserData ---"
            ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" 2>/dev/null || echo "  (missing)"
            exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          echo "Using provisioning profile: $PROFILE_PATH (UUID $PROFILE_UUID)"
          # Set the build number (CFBundleVersion) to Codemagic's monotonic
          # $BUILD_NUMBER so every upload to App Store Connect has a unique,
          # increasing build number — Apple rejects duplicate build numbers.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Submit the build to TestFlight. With no beta_groups listed this goes to
        # internal testers only, which needs no Beta App Review — that review is
        # what fails without Beta App Review info, and it's only triggered by
        # naming external groups here. Leaving this false uploaded the build to
        # App Store Connect but never handed it to TestFlight, so builds sat in
        # Connect and never reached a device.
        submit_to_testflight: true
        submit_to_app_store: false
